<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ESTUDOS CAO">
<meta name="theme-color" content="#ffffff">
<title>ESTUDOS CAO</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f5f5f7;color:#111}
main{max-width:720px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:28px;margin:0}.sub{color:#6b7280;font-size:13px;margin-top:4px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{font-size:12px;color:#6b7280}.big{font-size:27px;font-weight:750;margin-top:5px}
.bar{height:9px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#111;border-radius:20px}
button{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:11px 14px;font-size:14px}
.next{border-left:5px solid #111}.section{margin-top:18px}.daytitle{display:flex;justify-content:space-between;align-items:center;font-weight:750;margin-bottom:8px}
.lesson{padding:13px;border:1px solid;border-radius:14px;margin:8px 0}.green{background:#dcfce7;border-color:#86efac;color:#166534}.blue{background:#dbeafe;border-color:#93c5fd;color:#1e40af}
.lesson label{display:flex;gap:10px;align-items:flex-start}.lesson input{width:21px;height:21px;margin-top:1px;accent-color:currentColor}.kind{font-size:11px;font-weight:800}.name{font-weight:700;margin-top:3px}.time{font-size:12px;opacity:.75;margin-top:4px}
.done{opacity:.5}.daybar{height:7px;background:#e5e7eb;border-radius:20px;overflow:hidden}.daybar i{display:block;height:100%;background:#111}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body><main>
<div class="top"><div><h1>📚 ESTUDOS CAO</h1><div class="sub">Seu cronograma de estudos</div></div></div>
<div class="card stats"><div><div class="label">PROGRESSO GERAL</div><div id="pct" class="big">0%</div><div id="done" class="sub">0min00s estudadas</div></div><div><div class="label">TEMPO RESTANTE</div><div id="rest" class="big">26h49min06s</div><div id="count" class="sub">0 vídeos concluídos</div></div></div>
<div class="card"><div class="label">PROGRESSO</div><div class="bar"><div id="overall" class="fill" style="width:0"></div></div></div>
<div id="next" class="card next"><div class="label">PRÓXIMO CONTEÚDO</div><div id="nextName" style="font-weight:750;margin-top:5px">01/10 — Gerenciando com as Pessoas</div><div id="nextInfo" class="sub">26min09s · 🟩 OBRAS</div></div>
<div class="actions"><button id="nextBtn">▶ Ir para o próximo</button><button id="clearBtn">Limpar marcações</button></div>
<div id="days"></div>
</main>
<script>
const D=[
["29/09","TERÇA","CONTROLE","Integridade — Aula única",3500,1],["30/09","QUARTA","CONTROLE","Metas — Aula única",4312,1],
["01/10","QUINTA","MANHÃ · OBRAS","Gerenciando com as Pessoas — aula principal",1569],["01/10","QUINTA","MANHÃ · OBRAS","Liderança Primordial — aula principal",2191],["01/10","QUINTA","NOITE · LEIS","Diretriz de Segurança — aula única",2820],["01/10","QUINTA","NOITE · LEIS","Cyber PM — Parte 1",2423],["01/10","QUINTA","NOITE · LEIS","Cyber PM — Parte 2",1763],
["02/10","SEXTA","MANHÃ · OBRAS","Pipeline de Liderança — aula principal",2344],["02/10","SEXTA","MANHÃ · OBRAS","Polícia e Futuro — Parte 1",2700],["02/10","SEXTA","NOITE · LEIS","MAGIN 2026 — Novo Manual de Gestão de Imóveis — aula única",5839],
["05/10","SEGUNDA","MANHÃ · OBRAS","Polícia e Futuro — Parte 2",1270],["05/10","SEGUNDA","MANHÃ · OBRAS","Polícia e Futuro — Parte 3",1498],["05/10","SEGUNDA","MANHÃ · OBRAS","Empatia Assertiva — Parte 1",1087],["05/10","SEGUNDA","NOITE · LEIS","Portfólio — Vídeo 1",5683],
["06/10","TERÇA","MANHÃ · OBRAS","Empatia Assertiva — Parte 2",1366],["06/10","TERÇA","MANHÃ · OBRAS","Empatia Assertiva — Parte 3",1240],["06/10","TERÇA","MANHÃ · OBRAS","Empatia Assertiva — Parte Final",865],["06/10","TERÇA","MANHÃ · OBRAS","Gestão da Qualidade — Parte 1",1439],["06/10","TERÇA","NOITE · LEIS","Portfólio — Vídeo 2",3675],["06/10","TERÇA","NOITE · LEIS","Portfólio — Vídeo 3",3783],
["07/10","QUARTA","MANHÃ · OBRAS","Gestão da Qualidade — Parte 2",1077],["07/10","QUARTA","MANHÃ · OBRAS","Gestão da Qualidade — Parte 3",2149],["07/10","QUARTA","15H · LEIS","GDO — Vídeo 1",6597],["07/10","QUARTA","15H · LEIS","GDO — Vídeo 2",4466],["07/10","QUARTA","15H · LEIS","GDO — Vídeo 3",3170],["07/10","QUARTA","NOITE · LEIS","Licitações — Aula 01 / Parte I",4806],
["08/10","QUINTA","MANHÃ · OBRAS","Gestão da Qualidade — Parte 4",1410],["08/10","QUINTA","MANHÃ · OBRAS","Gestão de Riscos — Parte 1",1827],["08/10","QUINTA","NOITE · LEIS","Licitações — Aula 02 / Parte II",4177],["08/10","QUINTA","NOITE · LEIS","Licitações e Contratos — Parte I — 1º tempo",4094],
["09/10","SEXTA","MANHÃ · OBRAS","Gestão de Riscos — Parte 2",1929],["09/10","SEXTA","NOITE · LEIS","Licitações e Contratos — Parte I — 2º tempo",3655],["09/10","SEXTA","NOITE · LEIS","Licitações e Contratos — Parte II — 1º tempo",2793],["09/10","SEXTA","NOITE · LEIS","Licitações e Contratos — Parte II — 2º tempo",3029]
];
const total=964?0:26*3600+49*60+6;
const fmt=s=>{let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60),z=s%60;return h?`${h}h${String(m).padStart(2,"0")}min${String(z).padStart(2,"0")}s`:`${m}min${String(z).padStart(2,"0")}s`};
const days={};D.forEach((x,i)=>(days[x[0]]??=[]).push({...x,i}));
const root=document.getElementById("days");
Object.entries(days).forEach(([date,items])=>{
 let h=`<section class="section"><div class="daytitle"><span>${date} · ${items[0][1]}</span><span id="p${date.replace("/","")}">0%</span></div><div class="daybar"><i id="b${date.replace("/","")}" style="width:0"></i></div>`;
 items.forEach(x=>{let c=x[2].includes("MANHÃ")?"green":x[2].includes("LEIS")?"blue":"";h+=`<div class="lesson ${c}" data-row="${x.i}"><label><input type="checkbox" data-i="${x.i}" ${x[5]?"checked":""}><div><div class="kind">${x[2]}</div><div class="name">${x[3]}</div><div class="time">⏱ ${fmt(x[4])}</div></div></label></div>`});
 root.innerHTML+=h+"</section>";
});
function update(){
 let done=0,count=0;
 Object.entries(days).forEach(([date,items])=>{let d=0,t=0;items.forEach(x=>{t+=x[4];let cb=document.querySelector(`[data-i="${x.i}"]`),row=document.querySelector(`[data-row="${x.i}"]`);if(cb.checked){d+=x[4];count++;row.classList.add("done")}else row.classList.remove("done")});let p=d/t*100,k=date.replace("/","");document.getElementById("p"+k).textContent=p.toFixed(1)+"%";document.getElementById("b"+k).style.width=p+"%"});
 done=D.reduce((a,x,i)=>a+(document.querySelector(`[data-i="${i}"]`).checked?x[4]:0),0);
 let p=done/total*100;document.getElementById("pct").textContent=p.toFixed(1)+"%";document.getElementById("overall").style.width=p+"%";document.getElementById("done").textContent=fmt(done)+" estudadas";document.getElementById("rest").textContent=fmt(total-done);document.getElementById("count").textContent=count+" vídeos concluídos";
 let n=D.findIndex((x,i)=>!document.querySelector(`[data-i="${i}"]`).checked);
 if(n>=0){let x=D[n];document.getElementById("nextName").textContent=x[0]+" — "+x[3];document.getElementById("nextInfo").textContent=fmt(x[4])+" · "+(x[2].includes("MANHÃ")?"🟩 OBRAS":x[2].includes("LEIS")?"🟦 LEIS":"CONTROLE")}
 else {document.getElementById("nextName").textContent="🎉 Cronograma concluído!";document.getElementById("nextInfo").textContent="Todos os conteúdos foram marcados."}
}
document.addEventListener("change",e=>{if(e.target.matches("input[type=checkbox]"))update()});
document.getElementById("nextBtn").onclick=()=>{let n=D.findIndex((x,i)=>!document.querySelector(`[data-i="${i}"]`).checked);if(n>=0)document.querySelector(`[data-row="${n}"]`).scrollIntoView({behavior:"smooth",block:"center"})};
document.getElementById("clearBtn").onclick=()=>{D.forEach((x,i)=>document.querySelector(`[data-i="${i}"]`).checked=!!x[5]);update()};
update();
</script>
</body></html>
